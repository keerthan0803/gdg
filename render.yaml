services:
  # Backend Web Service
  - type: web
    name: lead-qualification-api
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: lead-qualification-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: CALENDLY_API_KEY
        sync: false
      - key: HUBSPOT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://lead-qualification-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: lead-qualification-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://lead-qualification-api.onrender.com

databases:
  # PostgreSQL Database
  - name: lead-qualification-db
    plan: free
    region: oregon
    databaseName: lead_qualification
    user: lead_admin
